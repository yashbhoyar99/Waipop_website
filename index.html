<style>

.back{display:inline-block;margin:26px 0 8px;color:var(--muted);text-decoration:none}

.size{color:var(--muted);margin:6px 0 22px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--muted);font:500 16px "DM Sans",sans-serif;padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}

.labelbox{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:#fff}
.labelbox img{display:block;min-width:720px;width:100%}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:14px}

.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}.cbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px}.cbox h2{font-size:20px;margin:0 0 16px}.cd{margin:0}.cd dt{color:var(--muted);font-size:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.cd dt:first-child{border:0;margin-top:0;padding-top:0}.cd dd{margin:2px 0 0}.cd a{color:var(--text)}.cbox label{display:block;font-weight:500;margin-top:16px}.cbox input,.cbox textarea{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;color:var(--text);background:var(--bg)}.cbox textarea{min-height:120px;resize:vertical}.cbox button{margin-top:20px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--text);color:#fff;font:700 16px "DM Sans",sans-serif;cursor:pointer}#cs{color:var(--muted);font-size:14px;margin:12px 0 0}

.card{transition:border-color .2s,box-shadow .2s}.card:hover,.card:focus-visible{transform:none;border-color:var(--c);box-shadow:0 8px 22px rgba(29,26,58,.12)}.card .stage{position:relative;height:auto;aspect-ratio:4/5;background:var(--surface)}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transition:none}.card:hover img{transform:none}.card .info{display:grid;gap:4px}
.qr{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(29,26,58,.62)}.qrbox{position:relative;width:100%;max-width:480px;max-height:100%;overflow:auto;background:var(--surface);border-radius:28px;padding:32px 28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center}.qrbox h2{font-size:46px;line-height:1;margin:0}.qrbox .tag{color:var(--muted);margin:6px 0 20px}.qrbox .cd{text-align:left;background:var(--bg);border-radius:16px;padding:18px 20px;margin-bottom:20px}.qrbox .cd dt{border:0;padding:0;margin-top:14px;color:var(--text);font-weight:700;font-size:15px}.qrbox .cd dt:first-child{margin-top:0}.qx{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--text);color:#fff;font-size:22px;line-height:1;cursor:pointer}.qgo{width:100%;padding:14px;border:0;border-radius:14px;background:var(--text);color:#fff;font:700 16px "DM Sans",sans-serif;cursor:pointer}
header{background:var(--surface)}.qlogo{height:92px;width:auto}

footer{border-top:1px solid var(--line);padding:26px clamp(18px,5vw,56px);color:var(--muted);font-size:14px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:820px){.detail,.show{grid-template-columns:minmax(0,1fr)}.detail>div,.show>div{min-width:0}.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.labelbox img{min-width:640px}.detail h1{font-size:44px}.pager a{padding:14px 16px}}
